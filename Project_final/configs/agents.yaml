# Cấu hình mặc định của từng tác tử. Giá trị dưới đây chỉ là điểm xuất phát,
# chỉnh lại sau khi thử nghiệm (chọn trên tập tune, không dùng ván đánh giá cuối).
#
# CÁCH ĐỌC FILE NÀY (xem agents/registry.py -> build_agent):
# - Mỗi mục cấp 1 là MỘT agent; tên mục là tên dùng trong log, ma trận kết quả và danh sách `agents` của tournament.yaml.
# - `type` (BẮT BUỘC): khóa trong AGENT_CLASSES của registry: random | heuristic | alphabeta | mcts | nn | rl.
#   Dùng nhiều mục cùng `type` khác `params` để tạo biến thể cho ablation.
# - `params`: dict các tham số của __init__ của lớp agent tương ứng (người làm agent phải đặt đúng tên tham số).
#   Registry chỉ đọc `type` và `params`; khóa nào để ngoài `params` sẽ BỊ BỎ QUA.
# - KHÔNG ghi `seed` trong `params` cho giải đấu: registry chỉ điền seed của từng ván khi params chưa có seed
#   (setdefault). Ghi cứng seed ở đây sẽ làm MỌI ván dùng cùng một seed. Khi chạy UI/demo thì tự truyền seed.
# - Agent chưa có code vẫn được khai báo ở đây; chỉ lỗi khi bạn đưa nó vào danh sách `agents` của giải đấu.

agents:
  random:
    type: random
    params: {}

  heuristic:
    type: heuristic
    params: 
      config_file: "configs/agents_heuristic.yaml"

  alphabeta:
    type: alphabeta
    params:
      # Đã tune: xem results/analysis/tune_search/chosen_params.md
      depth: 4                  # chỉ dùng khi KHÔNG có time_budget
      pruning: true
      move_ordering: true
      weights: {mobility: 80.0, disc_diff: 5.0, corners: 100.0, x_c_squares: 1.0}
      eval:
        disc_diff: true
        mobility: true
        corners: true
        x_c_squares: true
        stability: false

  mcts:
    type: mcts
    params:
      simulations: 2000        # chỉ dùng khi KHÔNG có time_budget
      exploration_c: 1.414      # sqrt(2); tune chưa phân biệt được các giá trị c (chosen_params.md)
      rollout_policy: heuristic # chọn từ tune mcts_rollout (chosen_params.md)

  mcts_leaf:                    # MCTS LAI: đánh giá nút lá bằng hàm đánh giá Alpha-Beta, không rollout
    type: mcts
    params:
      leaf_eval: true
      eval_scale: 25.0          # K trong sigmoid(điểm/K), chọn từ tune mcts_leaf_scale (K=5..400)
      eval_weights: {mobility: 80.0, disc_diff: 5.0}
      exploration_c: 1.414      # tune chưa phân biệt được các giá trị c # tune: rollout heuristic tốt hơn random (xem tune_summary.md)
      
  mcts_leaf:
    type: mcts
    params:
      leaf_eval: true
      eval_scale: 25
      eval_weights: {mobility: 80.0, disc_diff: 5.0}
      exploration_c: 1.414   

  nn:
    type: nn
    params:
      checkpoint: checkpoints/nn_supervised_alphabeta_v2.pt

  rl:
    type: rl
    params:
      checkpoint: checkpoints/rl_selfplay_alphabeta_v2.pt

  nn_heuristic:
    type: nn_heuristic
    params:
      checkpoint: checkpoints/nn_supervised_heuristic.pt     # phải trùng output của train_supervised.yaml

  rl_heuristic:
    type: rl_heuristic
    params:
      checkpoint: checkpoints/rl_selfplay_heuristic.pt       # phải trùng output của train_rl.yaml

  # ---- Biến thể cho ablation ----
