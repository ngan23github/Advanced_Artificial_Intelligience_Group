# Huấn luyện RL / self-play (cấp 6). Ghi đủ reward, số episode, exploration, mạng, siêu tham số.
# Phần việc của Người 3.
seed: 42
method: policy_gradient        # REINFORCE có baseline (đầu value của mạng). Q-learning/DQN không hợp bàn 8x8 với mạng nhỏ.
reward:
  win: 1.0                     # phải trùng game.yaml (có test kiểm tra). Reward chỉ phát ở CUỐI ván.
  draw: 0.0
  loss: -1.0
episodes: 20000                # số ván self-play. Nếu máy chậm: giảm và ghi trung thực số ván đã train vào báo cáo
init_from: checkpoints/nn_supervised_heuristic.pt   # (MỚI) khởi tạo từ NN supervised để so RL vs bắt chước (câu hỏi 3). Dùng --from-scratch để bỏ.
exploration:
  # Khám phá đến từ việc LẤY MẪU theo phân phối chính sách + entropy bonus (đã đổi từ epsilon-greedy cho nhất quán
  # với policy gradient; epsilon-greedy chỉ hợp với phương pháp dựa trên giá trị như DQN).
  type: policy_sampling
  temperature: 1.0             # lấy mẫu từ softmax(logit / temperature) khi self-play
  entropy_coef: 0.01           # hệ số thưởng entropy (chống chính sách co cụm quá sớm)
self_play:
  opening_plies: 4             # (MỚI) số nước đầu đi ngẫu nhiên để các ván self-play khác nhau
model:                         # chỉ dùng khi --from-scratch; nếu nạp init_from thì kiến trúc lấy từ checkpoint
  input_planes: 2              # khớp othello.encoding.encode_planes
  policy_outputs: 64           # khớp action_to_index
  channels: 64
  hidden: 128
train:
  lr: 0.0005
  gamma: 1.0                   # chiết khấu (1.0 = return chính là reward cuối ván)
  episodes_per_update: 16      # (thay cho batch_size) số ván self-play gom cho mỗi bước gradient (khoảng 800-900 nước)
  value_loss_coef: 0.5
  normalize_advantage: true
  grad_clip: 1.0
  device: auto
checkpoint_every: 999999       # lưu checkpoint định kỳ vào <checkpoint_dir>/rl_periodic/
eval:                          # đường cong học tập: cứ định kỳ cho mạng đang train (argmax) đấu agent cố định
  every_episodes: 1000
  # ghi vào meta.json. `nn` = NN supervised: đường cong RL vs NN trả lời trực tiếp câu hỏi 3.
  opponents: [random, heuristic, nn]
  games: 100
  seed_base: 900               # (MỚI) seed riêng của phần đánh giá khi train (không trùng seed tune 100-102, cuối 0-2)
output:
  checkpoint_dir: checkpoints/
  checkpoint_name: rl_selfplay_heuristic.pt     # checkpoint_dir + checkpoint_name phải trùng rl.checkpoint trong agents.yaml
  log_dir: results/logs/train_rl_heuristic/
