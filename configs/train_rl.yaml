# Huấn luyện RL / self-play (cấp 6). Ghi đủ reward, số episode, exploration, mạng, siêu tham số.
# Phần việc của Người 3. Các khóa đánh dấu (MỚI) do tui thêm để khớp với khung hiện có; Người 3 chốt hoặc bỏ.
seed: 42
method: policy_gradient        # TODO: chốt (Q-learning không hợp 8x8, nên dùng policy gradient / deep RL)
reward:
  win: 1.0                     # phải trùng game.yaml (có test kiểm tra)
  draw: 0.0
  loss: -1.0
episodes: 20000                # TODO: chốt theo tài nguyên
exploration:
  # CHÚ Ý: epsilon-greedy hợp với phương pháp dựa trên giá trị (Q-learning / DQN). Với policy gradient,
  # khám phá thường đến từ việc LẤY MẪU theo phân phối chính sách (kèm entropy bonus), không cần epsilon.
  # Nếu giữ policy_gradient thì nên đổi khối này (vd type: policy_sampling, entropy_coef: ...); nếu giữ
  # epsilon-greedy thì đổi method sang value-based (DQN). TODO: Người 3 chốt cho nhất quán.
  type: epsilon_greedy
  epsilon_start: 1.0
  epsilon_end: 0.05
  decay_episodes: 10000
model:
  input_planes: 2              # (MỚI) khớp othello.encoding.encode_planes
  policy_outputs: 64           # (MỚI) khớp action_to_index
  hidden: 128
train:
  lr: 0.0005
  gamma: 1.0
  batch_size: 128
checkpoint_every: 1000
eval:                          # (MỚI) đề yêu cầu đường cong học tập: cứ định kỳ cho agent đang train đấu agent cố định
  every_episodes: 1000
  opponents: [random, heuristic]   # TÊN MỤC trong agents.yaml; dùng các ván khai cuộc/seed riêng, không dùng ván đánh giá cuối
  games: 100
output:
  checkpoint_dir: checkpoints/
  checkpoint_name: rl_selfplay.pt     # (MỚI) checkpoint_dir + checkpoint_name phải trùng rl.checkpoint trong agents.yaml
  log_dir: results/logs/train_rl/
