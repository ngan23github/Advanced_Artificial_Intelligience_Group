# Cấu hình game. Cố định trước khi chạy giải đấu chính thức.
game: othello
version: "1.0"
board_size: 8            # bàn chính: 8x8 chuẩn
first_player: black      # Đen đi trước
pass_rule: forced_pass   # không có nước hợp lệ thì phải pass
terminal_rule: two_consecutive_passes
result_rule: disc_count  # nhiều quân hơn thắng, bằng nhau hòa
reward:
  win: 1.0
  draw: 0.0
  loss: -1.0
